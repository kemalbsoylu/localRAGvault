[project]
name = "localragvault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "ollama>=0.6.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "ruff>=0.16.0",
    "streamlit>=1.60.0",
    "ty>=0.0.63",
    "uvicorn>=0.51.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests that require a real local LLM (deselect with '-m \"not integration\"')"
]
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["uploads", "logs"]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort, B: bugbear
select = ["E", "F", "I", "B"]
# B008 is required for FastAPI's File(...) and Form(...) syntax
ignore = ["B008", "E501"]
