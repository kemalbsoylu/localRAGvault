name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    # Spin up a live pgvector service container for conftest.py
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Check Code Formatting (Ruff)
        run: uv run ruff format --check

      - name: Run Linter (Ruff)
        run: uv run ruff check

      - name: Run Static Type Checking (Ty)
        run: uv run ty check

      - name: Run Unit Test Suite (Pytest)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_test_password
        run: |
          uv run pytest -m "not integration" --cov=core --cov-report=term-missing
